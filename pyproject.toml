[project]
name = "expense-tracker-mcp"
version = "0.1.0"
description = "Remote MCP server for expense tracking, backed by Neon Postgres"
readme = "README.md"
authors = [
    { name = "Prathmesh Mhopare", email = "mhopareprathmesh5@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.31.0",
    "fastmcp>=3.4.7",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
client = [
    "langchain>=1.3.16",
    "langchain-google-genai>=4.3.5",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
]
# The UI is the terminal client plus a web framework, so this group includes
# `client` rather than repeating it. `uv sync --group ui` gets both.
ui = [
    { include-group = "client" },
    "streamlit>=1.62.0",
]

[tool.uv]
# Streamlit Community Cloud installs with `uv sync` against uv.lock, and
# `uv sync` installs only default groups -- so without this the deployed app
# starts with none of its dependencies and dies on `import psycopg`.
#
# The cost is real and accepted: Horizon now installs the UI packages into the
# server image too, which it never imports. A slower server build is a better
# trade than a second dependency file that drifts, and the alternative (a
# requirements.txt) was silently ignored because uv.lock takes precedence.
default-groups = ["ui"]
